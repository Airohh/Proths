global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api        # trafic, confiance, feedback, version servie
    static_configs:
      - targets: ["api:8000"]

  - job_name: monitor    # drift, précision live, retrains
    static_configs:
      - targets: ["monitor:8001"]
