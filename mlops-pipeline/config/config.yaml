# Configuration centrale du pipeline MLOps

# Configuration des données
data:
  raw_path: "data/raw"
  processed_path: "data/processed"
  train_file: "train.csv"
  test_file: "test.csv"
  validation_split: 0.2
  random_seed: 42

# Configuration du preprocessing
preprocessing:
  text_column: "text"
  label_column: "label"
  max_features: 5000
  ngram_range: [1, 2]
  min_df: 2
  max_df: 0.95
  stop_words: "english"

# Configuration des modèles
models:
  random_forest:
    n_estimators: 100
    max_depth: 10
    random_state: 42
    n_jobs: -1
  lightgbm:
    n_estimators: 100
    max_depth: 10
    learning_rate: 0.1
    random_state: 42
    verbose: -1

# Configuration MLflow
mlflow:
  tracking_uri: "${MLFLOW_TRACKING_URI:-./mlruns}"
  experiment_name: "document-classification"
  registry_uri: "${MLFLOW_REGISTRY_URI:-models:/}"
  artifact_root: "./mlruns"

# Configuration de l'API
api:
  host: "0.0.0.0"
  port: 8000
  reload: false
  workers: 4
  timeout: 30
  max_request_size: 10485760  # 10MB

# Configuration du monitoring
monitoring:
  drift_threshold: 0.1
  check_interval: 3600  # 1 heure en secondes
  prometheus_port: 9090
  metrics_path: "/metrics"

# Configuration du retrain
retrain:
  enabled: true
  trigger:
    type: "drift"  # drift, schedule, manual
    drift_threshold: 0.15
    schedule: "0 2 * * *"  # Cron: tous les jours à 2h
  min_improvement: 0.01  # Amélioration minimale pour déployer
  comparison_metric: "f1_score"

# Configuration Docker
docker:
  image_name: "mlops-pipeline"
  image_tag: "latest"
  registry: "${DOCKER_REGISTRY:-}"

# Configuration des tests
testing:
  coverage_threshold: 0.80
  test_timeout: 300

