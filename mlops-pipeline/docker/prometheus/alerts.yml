groups:
  - name: mlops_alerts
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: rate(prediction_errors_total[5m]) / rate(predictions_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      - alert: ModelNotLoaded
        expr: model_loaded == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Model not loaded"
          description: "The ML model is not loaded in the API"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(api_request_latency_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency"
          description: "P95 latency is {{ $value }}s (threshold: 1s)"

      - alert: NoPredictions
        expr: rate(predictions_total[5m]) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No predictions received"
          description: "No predictions have been made in the last 10 minutes"

