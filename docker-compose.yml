# Stack complète : MLflow, API, monitor, Prometheus, Grafana.
#
#   make seed   # une fois : télécharge AG News et entraîne le premier champion
#   make up     # démarre la stack
#   make drift  # envoie du trafic biaisé + feedback, et regarde Grafana réagir

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: proths-app:latest
  environment:
    MLFLOW_TRACKING_URI: http://mlflow:5000
    DATA_DIR: /app/data/processed
    PREDICTIONS_DB: /app/data/predictions.db
    API_RELOAD_URL: http://api:8000/model/reload
    MODEL_POLL_SECONDS: "15"
    GIT_PYTHON_REFRESH: quiet
    MONITOR_INTERVAL: "20"
    RETRAIN_COOLDOWN: "${RETRAIN_COOLDOWN:-120}"
  volumes:
    - app-data:/app/data
  depends_on:
    mlflow:
      condition: service_healthy

services:
  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    image: proths-mlflow:latest
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Tâche ponctuelle (profil "setup") : données + premier champion.
  trainer:
    <<: *app
    profiles: ["setup"]
    command: >
      sh -c "python scripts/prepare_ag_news.py --train-size ${TRAIN_SIZE:-120000}
      && python -m src.training.train"

  api:
    <<: *app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  monitor:
    <<: *app
    command: ["python", "-m", "src.monitoring.monitor"]
    depends_on:
      mlflow:
        condition: service_healthy
      api:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
      # Démo locale : lecture seule sans login. À retirer hors de sa machine.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mlops-dashboard.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  app-data:
  mlflow-data:
  prometheus-data:
  grafana-data:
